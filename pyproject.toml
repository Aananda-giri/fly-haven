[project]
name = "fly-heaven"
version = "0.1.0"
description = "Notebook reproductions of the fly-wirehead and fruitless MaleCNS connectome experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chess>=1.11.2",
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "nbconvert",
    "numba",
    "numpy",
    "pandas",
    "pillow",
    "pyarrow",
    "scikit-learn>=1.9.1",
    "scipy",
    "torch>=2.14.0",
    "zstandard>=0.25.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
