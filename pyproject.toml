[project]
name = "fly-haven"
version = "0.1.0"
description = "Notebook reproductions of the fly-wirehead and fruitless MaleCNS connectome experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "nbconvert",
    "numpy",
    "pandas",
    "pillow",
    "pyarrow",
    "scipy",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
